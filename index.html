<!DOCTYPE html>
<html lang="de">
     <head>
        <meta charset="utf-8">
        <title>Weather Forecast</title>
        <script src="app.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1 id="city-name">Berlin, DE</h1>
            <div class="search-wrapper">
                <input type="text" id="new-city" name="city" placeholder="search another city" autocomplete="off">
                <div id="city-suggestions"></div>
            </div>
        </header>
        <main>
            <div class="layout">
                <section class="weather-card">
                    <p id="date">15.05.2025</p>
                    <h2 id="week-day">Monday</h2>
                    <img id="weather-icon" src="" alt="weather icon">
                    <p id="weather-state">sunny</p>
                    <h2 id="current-temp">20°</h2>
                    <p id="max-temp">23°</p>
                    <p id="min-temp">11°</p>
                    <p>Humidity:</p>
                    <p id="humidity-value">33%</p>
                    <p>Wind:</p>
                    <p id="wind-value">18 km/h</p>
                    <p>UV Index:</p>
                    <p id="uv-index-value">5</p>
                </section>
                <aside class="forecast-sidebar">
                    <div class="forecast-card"></div>
                    <div class="forecast-card"></div>
                    <div class="forecast-card"></div>
                    <div class="forecast-card"></div>
                    <div class="forecast-card"></div>
                    <div class="forecast-card"></div>
                    <div class="forecast-card"></div>
                </aside>
            </div>
        </main>
        <div id="toast"></div>
    </body>
</html>
