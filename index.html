<!DOCTYPE html>
<html lang="en">
     <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Weather Forecast</title>
        <meta name="description" content="Type in your city to see the current weather, hourly temperatures and a 7-day forecast.">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Weather Forecast">
        <meta property="og:description" content="Type in your city to see the weather forecast.">
        <link rel="icon" type="image/svg+xml" href="icons/Sun.svg">
        <script src="shared.js" defer></script>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body class="start-page">
        <main class="hero">
            <img src="icons/Sun.svg" alt="" class="hero-sun">
            <div class="hero-text">
                <h1 class="hero-title">Weather<br>Forecast</h1>
                <p class="hero-subtitle">Type in your city</p>
                <div class="hero-search">
                    <div class="search-wrapper">
                        <input type="text" id="city" name="city" class="hero-input" placeholder="e.g Berlin" aria-label="City name" autocomplete="off">
                        <div id="city-suggestions"></div>
                    </div>
                    <button id="search-btn" type="button" class="hero-btn" aria-label="Go to weather forecast">Ok</button>
                </div>
            </div>
        </main>
        <div id="toast" role="status" aria-live="polite"></div>
    </body></html>
